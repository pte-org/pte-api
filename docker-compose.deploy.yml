# Hosted-demo overlay. Always third in the chain, never on its own:
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.services.yml \
#                  -f docker-compose.deploy.yml up -d
#
# Expects the two repos cloned as siblings, because web.Dockerfile builds pnpm
# workspace members and needs the pte-web root as its context:
#
#   ~/pte-org/pte-api   <- this file
#   ~/pte-org/pte-web
#
# What this overlay changes, and why:
#   1. Caps every JVM. Without a limit each container sees the host's full RAM
#      and sizes its heap from that, so app + gateway would each claim a
#      multi-GB max heap on a shared box.
#   2. Stretches healthcheck start_period. Spring Boot apps booting on 4 ARM
#      cores do not always answer /actuator/health inside the 40s the base
#      file allows, and compose would keep marking them unhealthy.
#   3. Points media's presign host (inside `app`) at a public origin. The base
#      value (http://localhost:9000) is correct for a laptop and wrong
#      everywhere else — the URL is handed to a browser, not to another
#      container.
#   4. Adds Caddy + the two Next.js apps.
#
# Backend containers: gateway + app, backed by a single postgres instance.
#
# Not changed: the published host ports on postgres/redis/rabbitmq/minio.
# The VCN Security List is the actual boundary and only admits 22/80/443, so
# those ports are reachable over SSH tunnel and nothing else. Keeping them
# makes debugging a one-liner instead of a compose edit.

x-jvm-env: &jvm-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"

x-slow-start: &slow-start
  start_period: 120s

x-limits: &limits
  mem_limit: 512m
  restart: unless-stopped
  healthcheck: *slow-start

services:
  # `app` is the only backend container, and it has no `/internal/**`
  # service-key surface at all (a cross-module call is a Java method call
  # inside one process, not an HTTP request with its own trust boundary to
  # defend — see identity's SecurityConfig).
  app:
    <<: *limits
    environment:
      <<: *jvm-env
      # Signed with this host, so it must be the origin the browser will hit.
      MINIO_PUBLIC_ENDPOINT: https://${MEDIA_DOMAIN}

  gateway:
    <<: *limits
    environment:
      <<: *jvm-env
      # Same-origin routing in the Caddyfile means the browser never sends a
      # cross-origin request; this stays set as the fallback for any client
      # that is not served from these two hosts (the Flutter app, curl, Postman).
      CORS_ALLOWED_ORIGINS: https://${TENANT_DOMAIN},https://${ADMIN_DOMAIN}

  postgres:
    mem_limit: 1g

  rabbitmq:
    mem_limit: 512m

  redis:
    mem_limit: 256m

  minio:
    mem_limit: 512m

  jaeger:
    mem_limit: 512m

  web-tenant:
    build:
      context: ../pte-web
      dockerfile: ../pte-api/deploy/web.Dockerfile
      args:
        APP: tenant-web
        NEXT_PUBLIC_API_BASE_URL: https://${TENANT_DOMAIN}
    mem_limit: 512m
    restart: unless-stopped
    networks: [pte-network]

  web-vendor:
    build:
      context: ../pte-web
      dockerfile: ../pte-api/deploy/web.Dockerfile
      args:
        APP: vendor-web
        NEXT_PUBLIC_API_BASE_URL: https://${ADMIN_DOMAIN}
    mem_limit: 512m
    restart: unless-stopped
    networks: [pte-network]

  caddy:
    image: caddy:2
    container_name: pte-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TENANT_DOMAIN: ${TENANT_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volume, not a bind or anonymous mount: the Let's Encrypt account
      # key and issued certificates live here. Lose it and every restart
      # re-issues, which hits the 5-certificates-per-domain-per-week rate limit
      # and locks the demo out of HTTPS for days.
      - caddy_data:/data
      - caddy_config:/config
    networks: [pte-network]

volumes:
  caddy_data:
  caddy_config:
