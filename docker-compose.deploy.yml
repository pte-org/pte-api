# Hosted-demo overlay. Always third in the chain, never on its own:
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.services.yml \
#                  -f docker-compose.deploy.yml up -d
#
# Expects the two repos cloned as siblings, because web.Dockerfile builds pnpm
# workspace members and needs the pte-web root as its context:
#
#   ~/pte-org/pte-api   <- this file
#   ~/pte-org/pte-web
#
# What this overlay changes, and why:
#   1. Caps every JVM. Without a limit each container sees the host's full RAM
#      and sizes its heap from that, so app would claim a multi-GB max heap on
#      a shared box.
#   2. Stretches healthcheck start_period. Spring Boot apps booting on 4 ARM
#      cores do not always answer /actuator/health inside the 40s the base
#      file allows, and compose would keep marking them unhealthy.
#   3. Media uploads and delivery use Cloudinary directly; no media origin is
#      hosted by this stack.
#   4. Narrows CORS_ALLOWED_ORIGINS to the two real hosted origins (the base
#      file's localhost defaults are for local dev only).
#   5. Adds Nginx + the two Next.js apps.
#
# Backend containers: app alone, backed by a single postgres instance. Nginx
# routes straight to app (gateway-removal) — see deploy/nginx.conf.template.
#
# Production publishes only Nginx. Internal services remain reachable on the
# Docker network and can still be inspected with `docker compose exec` or an
# SSH tunnel when needed.

x-jvm-env: &jvm-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"

x-slow-start: &slow-start
  start_period: 120s

x-limits: &limits
  mem_limit: 512m
  restart: unless-stopped
  healthcheck: *slow-start

services:
  # `app` is the only backend container, and it has no `/internal/**`
  # service-key surface at all (a cross-module call is a Java method call
  # inside one process, not an HTTP request with its own trust boundary to
  # defend — see identity's SecurityConfig).
  app:
    <<: *limits
    ports: !reset []
    environment:
      <<: *jvm-env
      # Same-origin routing in the Nginx config means the browser never sends a
      # cross-origin request; this stays set as the fallback for any client
      # that is not served from these two hosts (the Flutter app, curl, Postman).
      CORS_ALLOWED_ORIGINS: https://${TENANT_DOMAIN},https://${ADMIN_DOMAIN},https://${PRACTICE_DOMAIN}

  postgres:
    mem_limit: 1g
    ports: !reset []

  rabbitmq:
    mem_limit: 512m
    ports: !reset []

  redis:
    mem_limit: 256m
    ports: !reset []

  mailpit:
    ports: !reset []

  jaeger:
    mem_limit: 512m
    ports: !reset []

  web-tenant:
    build:
      context: ../pte-web
      dockerfile: ../pte-api/deploy/web.Dockerfile
      args:
        APP: tenant-web
        NEXT_PUBLIC_API_BASE_URL: https://${TENANT_DOMAIN}
    mem_limit: 512m
    restart: unless-stopped
    ports: !reset []
    networks: [pte-network]

  web-vendor:
    build:
      context: ../pte-web
      dockerfile: ../pte-api/deploy/web.Dockerfile
      args:
        APP: vendor-web
        NEXT_PUBLIC_API_BASE_URL: https://${ADMIN_DOMAIN}
    mem_limit: 512m
    restart: unless-stopped
    ports: !reset []
    networks: [pte-network]

  web-practice:
    build:
      context: ../pte-practice
      dockerfile: ../pte-api/deploy/practice.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${PRACTICE_DOMAIN:-pte-practice.duckdns.org}
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [pte-network]

  nginx:
    image: nginx:1.27-alpine
    container_name: pte-nginx
    restart: unless-stopped
    command: ["/bin/sh", "/usr/local/bin/nginx-entrypoint.sh"]
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      TENANT_DOMAIN: ${TENANT_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      PRACTICE_DOMAIN: ${PRACTICE_DOMAIN:-pte-practice.duckdns.org}
    volumes:
      - ./deploy/nginx-entrypoint.sh:/usr/local/bin/nginx-entrypoint.sh:ro
      - ./deploy/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./deploy/nginx.bootstrap.conf.template:/etc/nginx/templates/nginx.bootstrap.conf.template:ro
      - certbot_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
      web-tenant:
        condition: service_started
      web-vendor:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  certbot:
    image: certbot/certbot:latest
    profiles: [certbot]
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  certbot_webroot:
    name: pte_certbot_webroot
  letsencrypt:
    name: pte_letsencrypt
