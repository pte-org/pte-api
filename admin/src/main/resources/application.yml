server:
  port: ${ADMIN_PORT:8082}
  servlet:
    context-path: /api/admin

spring:
  application:
    name: admin
  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/admin}
    username: ${ADMIN_DB_USER:admin_svc}
    password: ${ADMIN_DB_PASSWORD:admin_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate iam-issued tokens locally via its JWKS.
          jwk-set-uri: ${IAM_JWKS_URI:http://localhost:8081/api/iam/auth/jwks}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

