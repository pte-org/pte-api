server:
  port: ${APP_PORT:8091}

spring:
  application:
    name: app
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/pte}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${APP_DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

identity:
  # PKCS#8 PEM-encoded RSA private key (identity.internal.security.RsaKeyProvider).
  # Empty falls back to an ephemeral key with a startup warning — fine for a
  # first local run, never acceptable once more than one person/environment
  # needs tokens to survive a restart. Generate one with:
  #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out identity-key.pem
  rsa-private-key-pem: ${IDENTITY_RSA_PRIVATE_KEY_PEM:}
