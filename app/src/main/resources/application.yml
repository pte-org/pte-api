server:
  port: ${APP_PORT:8091}

# Ported from gateway/src/main/resources/application.yml when gateway was
# removed (plans/modular-monolith gateway-removal) -- nothing sits in front
# of this app anymore, so it owns its own CORS and per-tenant rate limit.
# See com.pte.identity.internal.config.SecurityConfig and
# com.pte.shared.web.RateLimitFilter.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

rate-limit:
  per-second: ${RATE_LIMIT_PER_SECOND:40}
  redeem-per-second: ${REDEEM_RATE_LIMIT_PER_SECOND:5}

billing:
  payos:
    client-id: ${PAYOS_CLIENT_ID}
    api-key: ${PAYOS_API_KEY}
    checksum-key: ${PAYOS_CHECKSUM_KEY}
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    return-url: ${PAYOS_RETURN_URL}
    cancel-url: ${PAYOS_CANCEL_URL}
    connect-timeout-ms: ${PAYOS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PAYOS_READ_TIMEOUT_MS:10000}
    payment-link-ttl-hours: ${PAYOS_PAYMENT_LINK_TTL_HOURS:24}
  order:
    pending-ttl-hours: ${BILLING_ORDER_PENDING_TTL_HOURS:24}
  order-expiration:
    cron: ${BILLING_ORDER_EXPIRATION_CRON:0 0 * * * *}
  license-code-expiration:
    cron: ${BILLING_LICENSE_CODE_EXPIRATION_CRON:0 15 * * * *}

spring:
  application:
    name: app
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/pte}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${APP_DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_SMTP_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}

notification:
  mail-from: ${MAIL_FROM:no-reply@ptehub.local}
  application-response-sla-hours: ${TENANT_APPLICATION_RESPONSE_SLA_HOURS:72}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

media:
  storage:
    # Used for this module's own server-to-server calls to MinIO (bucket
    # bootstrap, WAV duration read-back) — must be reachable from inside
    # this app's own network (the docker-compose internal hostname).
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Used ONLY to sign presigned upload/download URLs handed back to an
    # external caller (a student's pte-app instance) — must be reachable
    # from THAT caller's network, which differs from `endpoint` whenever
    # MinIO sits behind a docker-compose-internal hostname. Defaults to the
    # same value as `endpoint`; override separately only when they differ.
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${media.storage.endpoint}}
    # Only used by the presign-only MinioClient to avoid a real
    # GetBucketLocation network call it can't make from inside this
    # container.
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MEDIA_BUCKET:pte-media}

attempt:
  # RSA keypair for answer-submission encryption (STRICT answerIntegrityLevel
  # attempts only). attempt holds its own keypair — never identity's — so no
  # call to identity is needed for key material at submission time. Outside
  # dev/local profiles, EncryptionKeyProvider fails fast at startup if either
  # is missing (a restart with an ephemeral keypair would invalidate every
  # STRICT-pinned attempt's public key).
  encryption:
    private-key-pem: ${ATTEMPT_ENCRYPTION_PRIVATE_KEY_PEM:}
    public-key-pem: ${ATTEMPT_ENCRYPTION_PUBLIC_KEY_PEM:}

proctor:
  ws:
    # STOMP endpoint allowed origins (com.pte.proctoring, Phase 09) — the proctor
    # console is a controlled client, explicit config rather than "*".
    allowed-origin-patterns: ${PROCTOR_WS_ALLOWED_ORIGINS:http://localhost:*}

identity:
  # PKCS#8 PEM-encoded RSA private key (identity.internal.security.RsaKeyProvider).
  # Empty falls back to an ephemeral key with a startup warning — fine for a
  # first local run, never acceptable once more than one person/environment
  # needs tokens to survive a restart. Generate one with:
  #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out identity-key.pem
  rsa-private-key-pem: ${IDENTITY_RSA_PRIVATE_KEY_PEM:}

# Optional AI provider (com.pte.scoring, Phase 08). Keep stub as the default
# for local development. Set SCORING_AI_PROVIDER=openai-compatible only with
# deployment-owned credentials and explicitly selected models; the adapter
# then calls /chat/completions.
scoring:
  ai:
    provider: ${SCORING_AI_PROVIDER:stub}
    base-url: ${SCORING_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${SCORING_AI_API_KEY:}
    essay-model: ${SCORING_AI_ESSAY_MODEL:}
    speech-model: ${SCORING_AI_SPEECH_MODEL:}
    audio-format: ${SCORING_AI_AUDIO_FORMAT:wav}
    max-tokens: ${SCORING_AI_MAX_TOKENS:800}
    media-url-ttl-seconds: ${SCORING_AI_MEDIA_URL_TTL_SECONDS:120}
    connect-timeout-ms: ${SCORING_AI_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SCORING_AI_READ_TIMEOUT_MS:30000}
