server:
  port: ${APP_PORT:8091}

# Ported from gateway/src/main/resources/application.yml when gateway was
# removed (plans/modular-monolith gateway-removal) -- nothing sits in front
# of this app anymore, so it owns its own CORS and per-tenant rate limit.
# See com.pte.identity.internal.config.SecurityConfig and
# com.pte.shared.web.RateLimitFilter.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

app:
  auth:
    tokens:
      access-token-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:604800}
  web:
    tenant-url: ${APP_WEB_TENANT_URL:http://localhost:3000}
    admin-url: ${APP_WEB_ADMIN_URL:http://localhost:3001}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    retention-days: ${PASSWORD_RESET_RETENTION_DAYS:7}
    # Requests per e-mail and per client address within the window; more are ignored quietly.
    throttle:
      email-limit: ${PASSWORD_RESET_EMAIL_LIMIT:3}
      ip-limit: ${PASSWORD_RESET_IP_LIMIT:10}
      window: ${PASSWORD_RESET_THROTTLE_WINDOW:15m}
    # Reset e-mails are sent off the request thread; a full queue drops the request.
    mail:
      max-threads: ${PASSWORD_RESET_MAIL_MAX_THREADS:4}
      queue-capacity: ${PASSWORD_RESET_MAIL_QUEUE_CAPACITY:200}
  security:
    # Wrong passwords for one account from one address before sign-in is refused until the window ends.
    login:
      failure-limit: ${LOGIN_FAILURE_LIMIT:5}
      window: ${LOGIN_LOCK_WINDOW:15m}

rate-limit:
  per-second: ${RATE_LIMIT_PER_SECOND:40}
  redeem-per-second: ${REDEEM_RATE_LIMIT_PER_SECOND:5}

practice:
  web:
    enabled: ${PRACTICE_WEB_ENABLED:false}
  scoring:
    rate-limit-per-minute: ${PRACTICE_SCORING_RATE_LIMIT_PER_MINUTE:10}
    max-retries: ${PRACTICE_SCORING_MAX_RETRIES:2}
    redispatch-after-seconds: ${PRACTICE_SCORING_REDISPATCH_AFTER_SECONDS:100}
    max-age-seconds: ${PRACTICE_SCORING_MAX_AGE_SECONDS:180}
  # Chat checks entitlement through assertUnlocked, which is fail-closed: with this false every student
  # gets 403 from chat. Set true in every environment that runs chat (dev, staging, production).
  strict-entitlement:
    enabled: ${PRACTICE_STRICT_ENTITLEMENT_ENABLED:false}
  entitlement:
    # When the practice app should ask again whether the student may practise.
    refresh-seconds: ${PRACTICE_ENTITLEMENT_REFRESH_SECONDS:300}

# Student chat uses the question-generation provider; no separate chat API key is needed.
# Provider settings are validated only when chat is enabled.
chat:
  ai:
    enabled: ${CHAT_AI_ENABLED:false}
    provider: openai-compatible
    api-key: ${itembank.generation.llm.api-key:}
    model: ${itembank.generation.llm.generator-model:Capstone}
    base-url: ${itembank.generation.llm.base-url:}
    temperature: ${CHAT_AI_TEMPERATURE:0.2}
    max-tokens: ${itembank.generation.llm.max-tokens:0}
    connect-timeout-ms: ${CHAT_AI_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CHAT_AI_READ_TIMEOUT_MS:90000}
    daily-limit: ${CHAT_AI_DAILY_LIMIT:20}
    max-input-chars: ${CHAT_AI_MAX_INPUT_CHARS:1000}
    history-size: ${CHAT_AI_HISTORY_SIZE:6}
    max-concurrent: ${CHAT_AI_MAX_CONCURRENT:20}
    # Only for the admin cost estimate; update when the provider changes the price of the pinned model.
    price-input-per-million-usd: ${CHAT_AI_PRICE_INPUT_PER_MILLION_USD:0.10}
    price-output-per-million-usd: ${CHAT_AI_PRICE_OUTPUT_PER_MILLION_USD:0.40}

billing:
  payos:
    client-id: ${PAYOS_CLIENT_ID}
    api-key: ${PAYOS_API_KEY}
    checksum-key: ${PAYOS_CHECKSUM_KEY}
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    return-url: ${PAYOS_RETURN_URL}
    cancel-url: ${PAYOS_CANCEL_URL}
    connect-timeout-ms: ${PAYOS_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PAYOS_READ_TIMEOUT_MS:10000}
    payment-link-ttl-hours: ${PAYOS_PAYMENT_LINK_TTL_HOURS:24}
  order:
    pending-ttl-hours: ${BILLING_ORDER_PENDING_TTL_HOURS:24}
  order-expiration:
    cron: ${BILLING_ORDER_EXPIRATION_CRON:0 0 * * * *}
  license-code-expiration:
    cron: ${BILLING_LICENSE_CODE_EXPIRATION_CRON:0 15 * * * *}
  license-code:
    # How long a platform admin has to confirm a revoke after previewing it.
    revoke-preview-ttl: ${BILLING_LICENSE_REVOKE_PREVIEW_TTL:5m}

spring:
  application:
    name: app
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/pte}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${APP_DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_SMTP_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}

notification:
  mail-from: ${MAIL_FROM:no-reply@pteprep.local}
  inbox:
    # Enable after additive migration and the notification rollout checks; email delivery is independent.
    enabled: ${NOTIFICATION_INBOX_ENABLED:false}
    poll-delay-ms: ${NOTIFICATION_INBOX_POLL_DELAY_MS:1000}
    batch-size: ${NOTIFICATION_INBOX_BATCH_SIZE:50}
    max-attempts: ${NOTIFICATION_INBOX_MAX_ATTEMPTS:5}
    lease-seconds: ${NOTIFICATION_INBOX_LEASE_SECONDS:30}
    initial-retry-seconds: ${NOTIFICATION_INBOX_INITIAL_RETRY_SECONDS:5}
    max-retry-seconds: ${NOTIFICATION_INBOX_MAX_RETRY_SECONDS:300}
    retry-jitter-seconds: ${NOTIFICATION_INBOX_RETRY_JITTER_SECONDS:3}
  session-reminder:
    poll-delay-ms: ${NOTIFICATION_SESSION_REMINDER_POLL_DELAY_MS:60000}
    threshold-seconds: ${NOTIFICATION_SESSION_REMINDER_THRESHOLD_SECONDS:900}
  email:
    # A failed send is tried again with a growing wait, then goes to the dead-letter queue.
    retry:
      max-attempts: ${NOTIFICATION_EMAIL_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${NOTIFICATION_EMAIL_RETRY_INITIAL_INTERVAL_MS:2000}
      max-interval-ms: ${NOTIFICATION_EMAIL_RETRY_MAX_INTERVAL_MS:10000}

scoring:
  grading-reconciliation:
    poll-delay-ms: ${SCORING_GRADING_RECONCILIATION_POLL_DELAY_MS:60000}
  # Optional AI provider (com.pte.scoring, Phase 08). Keep stub as the default
  # for local development. Set SCORING_AI_PROVIDER=openai-compatible only with
  # deployment-owned credentials and explicitly selected models; the adapter
  # then calls /chat/completions.
  ai:
    provider: ${SCORING_AI_PROVIDER:stub}
    base-url: ${SCORING_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${SCORING_AI_API_KEY:}
    essay-model: ${SCORING_AI_ESSAY_MODEL:}
    speech-model: ${SCORING_AI_SPEECH_MODEL:}
    audio-format: ${SCORING_AI_AUDIO_FORMAT:wav}
    max-tokens: ${SCORING_AI_MAX_TOKENS:800}
    media-url-ttl-seconds: ${SCORING_AI_MEDIA_URL_TTL_SECONDS:120}
    connect-timeout-ms: ${SCORING_AI_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SCORING_AI_READ_TIMEOUT_MS:30000}
    # Time one job may spend on vendor calls, retry waits included.
    job-budget-ms: ${SCORING_AI_JOB_BUDGET_MS:90000}
    # A host scoring request re-dispatches answers still AI_SCORING this long after dispatch.
    stale-dispatch-minutes: ${SCORING_AI_STALE_DISPATCH_MINUTES:10}
    # Calls per request to one AI vendor when it answers with a temporary error, and the failures in a row
    # after which that vendor is left alone for a minute.
    retry-max-attempts: ${SCORING_AI_RETRY_MAX_ATTEMPTS:3}
    breaker-threshold: ${SCORING_AI_BREAKER_THRESHOLD:5}
    # provider=azure-gemini: speech via Azure short-audio REST, text and images via Gemini.
    # It reads connect-timeout-ms above but not read-timeout-ms; each vendor has its own timeout-ms.
    azure:
      speech-key: ${SCORING_AI_AZURE_SPEECH_KEY:}
      speech-region: ${SCORING_AI_AZURE_SPEECH_REGION:}
      timeout-ms: ${SCORING_AI_AZURE_TIMEOUT_MS:60000}
    gemini:
      api-key: ${SCORING_AI_GEMINI_API_KEY:}
      model: ${SCORING_AI_GEMINI_MODEL:gemini-flash-lite-latest}
      timeout-ms: ${SCORING_AI_GEMINI_TIMEOUT_MS:60000}
    # Who reads transcripts, essays and pictures under azure-gemini (Azure Speech always does the audio):
    # gemini = the Google API above; gateway = an OpenAI-compatible /chat/completions service, by default the same
    # Capstone gateway as question generation and the student chat (AI_GATEWAY_*).
    text-vendor: ${SCORING_AI_TEXT_VENDOR:gemini}
    gateway:
      base-url: ${SCORING_AI_GATEWAY_BASE_URL:${itembank.generation.llm.base-url:}}
      api-key: ${SCORING_AI_GATEWAY_API_KEY:${itembank.generation.llm.api-key:}}
      model: ${SCORING_AI_GATEWAY_MODEL:${itembank.generation.llm.generator-model:Capstone}}
      timeout-ms: ${SCORING_AI_GATEWAY_TIMEOUT_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

media:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    authoring-folder: ${CLOUDINARY_AUTHORING_FOLDER:pte/authoring}
    submission-folder: ${CLOUDINARY_SUBMISSION_FOLDER:pte/submissions}
    # Life of a signed upload or media link; also the cap on the link life any module asks for.
    signature-ttl-seconds: ${CLOUDINARY_SIGNATURE_TTL_SECONDS:900}

locations:
  vietnam:
    base-url: ${VIETNAM_LOCATION_BASE_URL:https://provinces.open-api.vn/api/v2}
    connect-timeout-ms: ${VIETNAM_LOCATION_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${VIETNAM_LOCATION_READ_TIMEOUT_MS:10000}
    cache-ttl-ms: ${VIETNAM_LOCATION_CACHE_TTL_MS:86400000}

attempt:
  capability:
    # Only snapshots without Phase 4 runtime provenance may use this legacy path.
    allow-legacy-missing-manifest: ${ATTEMPT_ALLOW_LEGACY_MISSING_MANIFEST:true}
    # Keep unsupported custom contracts observable before strict enforcement
    # is enabled after cross-repository compatibility checks.
    strict-preflight-enabled: ${ATTEMPT_STRICT_PRE_FLIGHT_ENABLED:false}
  security-audit:
    retention-days: ${ATTEMPT_SECURITY_AUDIT_RETENTION_DAYS:180}
    retention-cron: ${ATTEMPT_SECURITY_AUDIT_RETENTION_CRON:0 0 2 * * *}
  # The built exam of a running attempt, kept in Redis; one builder holds the lock while others wait.
  content-cache:
    ttl: ${ATTEMPT_CONTENT_CACHE_TTL:24h}
    lock-ttl: ${ATTEMPT_CONTENT_CACHE_LOCK_TTL:10s}
  # Extra life given to media links: on top of the session window at start, on top of the time left on reload.
  media-url:
    grace-seconds: ${ATTEMPT_MEDIA_URL_GRACE_SECONDS:60}
    reload-margin-seconds: ${ATTEMPT_MEDIA_URL_RELOAD_MARGIN_SECONDS:600}
  # RSA keypair for answer-submission encryption (STRICT answerIntegrityLevel
  # attempts only). attempt holds its own keypair — never identity's — so no
  # call to identity is needed for key material at submission time. Outside
  # dev/local profiles, EncryptionKeyProvider fails fast at startup if either
  # is missing (a restart with an ephemeral keypair would invalidate every
  # STRICT-pinned attempt's public key).
  encryption:
    private-key-pem: ${ATTEMPT_ENCRYPTION_PRIVATE_KEY_PEM:}
    public-key-pem: ${ATTEMPT_ENCRYPTION_PUBLIC_KEY_PEM:}

proctor:
  ws:
    # STOMP endpoint allowed origins (com.pte.proctoring, Phase 09) — the proctor
    # console is a controlled client, explicit config rather than "*".
    allowed-origin-patterns: ${PROCTOR_WS_ALLOWED_ORIGINS:http://localhost:*}

identity:
  # PKCS#8 PEM-encoded RSA private key (identity.internal.security.RsaKeyProvider).
  # Empty falls back to an ephemeral key with a startup warning — fine for a
  # first local run, never acceptable once more than one person/environment
  # needs tokens to survive a restart. Generate one with:
  #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out identity-key.pem
  rsa-private-key-pem: ${IDENTITY_RSA_PRIVATE_KEY_PEM:}

task-types:
  rollout:
    # Standard compatibility/read paths remain on. Enable custom creation
    # only after the authenticated walkthrough and metrics review.
    custom-creation-enabled: ${TASK_TYPES_CUSTOM_CREATION_ENABLED:false}

itembank:
  generation:
    # AI question generation for the platform bank (platform admins). Off unless explicitly enabled.
    enabled: ${QUESTION_GEN_ENABLED:false}
    # Deterministic stub generator: test, local and local-schema profiles only (startup fails elsewhere).
    stub: ${QUESTION_GEN_STUB:false}
    llm:
      # The AI gateway (Capstone) shared by generation, its reviewer, the student chat and text scoring.
      # AI_GATEWAY_* is the name to use; QUESTION_GEN_* is still read for older env files.
      base-url: ${AI_GATEWAY_BASE_URL:${QUESTION_GEN_BASE_URL:}}
      api-key: ${AI_GATEWAY_API_KEY:${QUESTION_GEN_API_KEY:}}
      generator-model: ${AI_GATEWAY_MODEL:${QUESTION_GEN_GENERATOR_MODEL:Capstone}}
      reviewer-model: ${QUESTION_GEN_REVIEWER_MODEL:${AI_GATEWAY_MODEL:Capstone}}
      generator-temperature: ${QUESTION_GEN_GENERATOR_TEMPERATURE:0.8}
      reviewer-temperature: ${QUESTION_GEN_REVIEWER_TEMPERATURE:0.0}
      max-tokens: ${QUESTION_GEN_MAX_TOKENS:0}
      connect-timeout: ${QUESTION_GEN_CONNECT_TIMEOUT:5s}
      read-timeout: ${QUESTION_GEN_READ_TIMEOUT:90s}
      retry-delay: ${QUESTION_GEN_RETRY_DELAY:2s}
      # Only for the cost estimate on the AI overview (USD per million tokens).
      price-input-per-million-usd: ${QUESTION_GEN_PRICE_INPUT_PER_MILLION_USD:0.10}
      price-output-per-million-usd: ${QUESTION_GEN_PRICE_OUTPUT_PER_MILLION_USD:0.40}
    kokoro:
      base-url: ${KOKORO_BASE_URL:}
      api-key: ${KOKORO_API_KEY:}
      timeout: ${KOKORO_TIMEOUT:300s}
      voices-us: ${QUESTION_GEN_VOICES_US:af_heart,af_bella,am_michael}
      voices-uk: ${QUESTION_GEN_VOICES_UK:bf_emma,bm_george}
    review:
      vision-check: ${QUESTION_GEN_VISION_CHECK:false}
    limits:
      max-items-per-job: ${QUESTION_GEN_MAX_ITEMS_PER_JOB:10}
      max-items-per-user-per-day: ${QUESTION_GEN_MAX_ITEMS_PER_USER_PER_DAY:100}
      max-items-per-day-global: ${QUESTION_GEN_MAX_ITEMS_PER_DAY_GLOBAL:300}
      max-concurrent-jobs: ${QUESTION_GEN_MAX_CONCURRENT_JOBS:3}
      max-calls-per-item: ${QUESTION_GEN_MAX_CALLS_PER_ITEM:40}
      max-calls-per-round: ${QUESTION_GEN_MAX_CALLS_PER_ROUND:5}
      consecutive-provider-failures-to-stop: ${QUESTION_GEN_CONSECUTIVE_FAILURES_TO_STOP:3}
    worker:
      poll-delay-ms: ${QUESTION_GEN_POLL_DELAY_MS:3000}
      lease-duration: ${QUESTION_GEN_LEASE_DURATION:10m}
    # The live view of a running job (server-sent events), held in memory on this instance.
    live:
      emitter-timeout-ms: ${QUESTION_GEN_LIVE_STREAM_TIMEOUT_MS:1800000}
      heartbeat-interval-ms: ${QUESTION_GEN_LIVE_HEARTBEAT_MS:15000}
      finished-retention-ms: ${QUESTION_GEN_LIVE_FINISHED_RETENTION_MS:600000}
      idle-retention-ms: ${QUESTION_GEN_LIVE_IDLE_RETENTION_MS:1800000}

shared:
  idempotency:
    # Nightly removal of idempotency keys past their retention.
    purge-cron: ${IDEMPOTENCY_PURGE_CRON:0 15 3 * * *}
