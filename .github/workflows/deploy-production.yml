name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pte-platform-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fast, secret-free sanity check: catches a YAML/interpolation mistake
      # before we ever spend an SSH session and a 40-minute budget on it.
      # docker-compose.deploy.yml's web-tenant/web-vendor build contexts point
      # at ../pte-web, which doesn't exist in this single-repo checkout —
      # `config` only parses/merges, it never touches build contexts, so that
      # path not existing here doesn't affect this check.
      - name: Validate merged compose files
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example \
            -f docker-compose.yml \
            -f docker-compose.services.yml \
            -f docker-compose.deploy.yml \
            config --quiet

  deploy:
    name: Deploy to Oracle VPS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?DEPLOY_SSH_PRIVATE_KEY secret is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS secret is required}"

          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/pte-deploy-key"
          install -m 644 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/pte-deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          test -s "$RUNNER_TEMP/pte-deploy-key"
          test -s "$HOME/.ssh/known_hosts"

      - name: Deploy on VPS
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/pte-deploy-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          API_DIR=/home/ubuntu/pte-org/pte-api
          test -d "$API_DIR/.git"
          exec 9>/tmp/pte-platform-production-deploy.lock
          if ! flock -w 1800 9; then
            echo "Deployment stopped: another deployment still holds the VPS lock."
            exit 1
          fi
          test "$(git -C "$API_DIR" branch --show-current)" = "main"
          if [ -n "$(git -C "$API_DIR" status --porcelain)" ]; then
            echo "Deployment stopped: API repository has uncommitted changes."
            git -C "$API_DIR" status --short
            exit 1
          fi
          git -C "$API_DIR" fetch --prune origin main
          git -C "$API_DIR" merge --ff-only FETCH_HEAD
          cd "$API_DIR"
          PTE_DEPLOY_LOCK_HELD=1 bash deploy/production.sh
          REMOTE

  verify:
    name: Verify public endpoints
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No SSH here — this checks from the outside (DNS → Nginx → TLS →
      # app/web), which the deploy job's internal container healthcheck
      # loop cannot see. Domains mirror TENANT_DOMAIN/ADMIN_DOMAIN in .env;
      # update here if they ever change.
      - name: Check tenant + admin origins
        shell: bash
        run: |
          set -euo pipefail

          check() {
            local url="$1"
            for attempt in 1 2 3; do
              if code=$(curl -fsS -o /dev/null -w '%{http_code}' "$url"); then
                echo "OK  $url ($code)"
                return 0
              fi
              [ "$attempt" -lt 3 ] && sleep 5
            done
            echo "FAIL $url did not respond after 3 attempts"
            return 1
          }

          status=0
          check https://pte-tenant.duckdns.org/actuator/health || status=1
          check https://pte-tenant.duckdns.org/ || status=1
          check https://pte-admin.duckdns.org/ || status=1
          check https://pte-practice.duckdns.org/ || status=1
          exit "$status"
