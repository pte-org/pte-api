server:
  port: ${IAM_PORT:8081}
  servlet:
    context-path: /api/iam

spring:
  application:
    name: iam
  datasource:
    url: ${IAM_DB_URL:jdbc:postgresql://localhost:5432/iam}
    username: ${IAM_DB_USER:iam_svc}
    password: ${IAM_DB_PASSWORD:iam_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
