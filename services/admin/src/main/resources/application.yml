server:
  port: ${ADMIN_PORT:8082}
  servlet:
    context-path: /api/admin

spring:
  application:
    name: admin
  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/admin}
    username: ${ADMIN_DB_USER}
    password: ${ADMIN_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${ADMIN_DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
        default-requeue-rejected: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate iam-issued tokens locally via its JWKS.
          jwk-set-uri: ${IAM_JWKS_URI:http://localhost:8081/api/iam/auth/jwks}

# Outbox polling relay (rabbitmq-outbox-migration Phase 2) — defaults live in
# AbstractOutboxRelay/AbstractOutboxCleanupJob; override here only if tuning is needed.
pte:
  outbox:
    poll-interval-ms: 2000
    batch-size: 100
    max-publish-attempts: 10
    cleanup-retention-days: 7
  roster:
    # One-time cold-start rebuild of the student roster projection from IAM.
    # See StudentRosterBackfillRunner: RabbitMQ cannot replay UserCreated events
    # published before this service's queue existed, so students predating the
    # projection are only recoverable by pulling them from IAM.
    backfill:
      enabled: ${ROSTER_BACKFILL_ENABLED:true}
      # 10 x 15s outlasts IAM's 120s healthcheck start_period on the hosted
      # box — admin's depends_on does not wait for IAM, so early attempts are
      # expected to fail while IAM is still booting.
      max-attempts: ${ROSTER_BACKFILL_MAX_ATTEMPTS:10}
      retry-delay: ${ROSTER_BACKFILL_RETRY_DELAY:15s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

iam:
  base-url: ${IAM_URL:http://localhost:8081/api/iam}
  export:
    connect-timeout: ${IAM_EXPORT_CONNECT_TIMEOUT:5s}
    read-timeout: ${IAM_EXPORT_READ_TIMEOUT:15s}

internal:
  service-key: ${INTERNAL_SERVICE_KEY}
  bootstrap-key: ${INTERNAL_BOOTSTRAP_KEY}

