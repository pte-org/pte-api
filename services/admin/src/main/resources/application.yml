server:
  port: ${ADMIN_PORT:8082}
  servlet:
    context-path: /api/admin

spring:
  application:
    name: admin
  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/admin}
    username: ${ADMIN_DB_USER:admin_svc}
    password: ${ADMIN_DB_PASSWORD:admin_dev_pw}
    hikari:
      maximum-pool-size: ${ADMIN_DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pte}
    password: ${RABBITMQ_PASSWORD:pte}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate iam-issued tokens locally via its JWKS.
          jwk-set-uri: ${IAM_JWKS_URI:http://localhost:8081/api/iam/auth/jwks}

# Outbox polling relay (rabbitmq-outbox-migration Phase 2) — defaults live in
# AbstractOutboxRelay/AbstractOutboxCleanupJob; override here only if tuning is needed.
pte:
  outbox:
    poll-interval-ms: 2000
    batch-size: 100
    max-publish-attempts: 10
    cleanup-retention-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

