server:
  port: ${EXAM_DELIVERY_PORT:8085}
  servlet:
    context-path: /api/exam-delivery

spring:
  application:
    name: exam-delivery
  datasource:
    url: ${EXAM_DELIVERY_DB_URL:jdbc:postgresql://localhost:5432/exam_delivery}
    username: ${EXAM_DELIVERY_DB_USER:exam_delivery_svc}
    password: ${EXAM_DELIVERY_DB_PASSWORD:exam_delivery_dev_pw}
    hikari:
      maximum-pool-size: ${EXAM_DELIVERY_DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IAM_JWKS_URI:http://localhost:8081/api/iam/auth/jwks}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pte}
    password: ${RABBITMQ_PASSWORD:pte}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

authoring:
  base-url: ${AUTHORING_URL:http://localhost:8083/api/authoring}
scheduling:
  base-url: ${SCHEDULING_URL:http://localhost:8084/api/scheduling}
media:
  base-url: ${MEDIA_URL:http://localhost:8090/api/media}

# Shared secret for calling authoring/scheduling's /internal/** surface, and
# for validating incoming calls to exam-delivery's own /internal/** endpoints
# (rabbitmq-outbox-migration Phase 9's attempt/answer export) — ADR-003 mTLS
# placeholder. Must match the value configured on every service in the mesh.
internal:
  service-key: ${INTERNAL_SERVICE_KEY:dev-internal-service-key-change-me}
  # Second credential (Phase 9): required, IN ADDITION TO service-key, to reach
  # the all-tenant bootstrap export mode. Never used for normal per-tenant calls.
  # MORE sensitive than service-key above (unlocks cross-tenant export) — the
  # dev-default fallback here must NEVER be left unset in any real deployment
  # (code-review finding: a forgotten env var here silently exposes cross-tenant
  # data, not just internal-service access). Pre-production checklist item.
  bootstrap-key: ${INTERNAL_BOOTSTRAP_KEY:dev-internal-bootstrap-key-change-me}

# The ONE guarded pull at attempt-create (phase-05). NotEntitledException is a
# clean business denial, not an infra failure — excluded from the failure rate
# so a wave of legitimate 403s never trips the breaker.
resilience4j:
  circuitbreaker:
    instances:
      scheduling:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.pte.examdelivery.domain.exception.NotEntitledException
      authoring:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      media:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Outbox polling relay (rabbitmq-outbox-migration Phase 5) — defaults live in
# AbstractOutboxRelay/AbstractOutboxCleanupJob; override here only if tuning is needed.
# Deployment note: this relay MUST stay single-instance — scoring's
# AnswerIngestConsumer (Phase 6) depends on AnswerSubmitted arriving in the
# order this outbox wrote them (plan.md, CONFIRMED).
pte:
  outbox:
    poll-interval-ms: 2000
    batch-size: 100
    max-publish-attempts: 10
    cleanup-retention-days: 7

