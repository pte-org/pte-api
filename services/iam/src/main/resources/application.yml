server:
  port: ${IAM_PORT:8081}
  servlet:
    context-path: /api/iam

spring:
  application:
    name: iam
  datasource:
    url: ${IAM_DB_URL:jdbc:postgresql://localhost:5432/iam}
    username: ${IAM_DB_USER}
    password: ${IAM_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${IAM_DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

internal:
  service-key: ${INTERNAL_SERVICE_KEY}
  bootstrap-key: ${INTERNAL_BOOTSTRAP_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Outbox polling relay (rabbitmq-outbox-migration Phase 3) — defaults live in
# AbstractOutboxRelay/AbstractOutboxCleanupJob; override here only if tuning is needed.
pte:
  outbox:
    poll-interval-ms: 2000
    batch-size: 100
    max-publish-attempts: 10
    cleanup-retention-days: 7

