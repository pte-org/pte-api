server:
  port: ${MEDIA_PORT:8090}
  servlet:
    context-path: /api/media

spring:
  application:
    name: media
  datasource:
    url: ${MEDIA_DB_URL:jdbc:postgresql://localhost:5432/media}
    username: ${MEDIA_DB_USER:media_svc}
    password: ${MEDIA_DB_PASSWORD:media_dev_pw}
    hikari:
      maximum-pool-size: ${MEDIA_DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IAM_JWKS_URI:http://localhost:8081/api/iam/auth/jwks}

media:
  storage:
    # Used for this service's own server-to-server calls to MinIO (bucket
    # bootstrap, etc.) — must be reachable from inside this service's own
    # network (the docker-compose internal hostname in local/dev).
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Used ONLY to sign presigned upload/download URLs handed back to an
    # external caller (a student's pte-app instance) — must be reachable
    # from THAT caller's network, which is not the same reachability as
    # `endpoint` above whenever MinIO sits behind a docker-compose-internal
    # hostname (`minio`) that only resolves inside the compose network, not
    # on the host machine a desktop/mobile client runs on. Defaults to the
    # same value as `endpoint` (correct for a real deployment where MinIO/S3
    # already has one publicly-routable address); override separately only
    # when the two genuinely differ, as they do in this local compose setup.
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${media.storage.endpoint}}
    # Only used by the presign-only MinioClient (MinioConfig.presignMinioClient)
    # to avoid a real GetBucketLocation network call it can't make from
    # inside this container — see that bean's own doc comment. MinIO itself
    # mostly ignores region; a real S3-compatible provider outside a
    # genuine "us-east-1" would need this overridden.
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ROOT_USER:pte-minio-admin}
    secret-key: ${MINIO_ROOT_PASSWORD:pte-minio-dev-pw}
    bucket: ${MEDIA_BUCKET:pte-media}

# Shared secret for the /internal/** service-to-service surface (ADR-003 mTLS
# placeholder) — MUST match the same env var on every service that calls or
# exposes /internal/**. Dev default only.
internal:
  service-key: ${INTERNAL_SERVICE_KEY:dev-internal-service-key-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
