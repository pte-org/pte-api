server:
  port: ${PROCTOR_PORT:8086}
  servlet:
    context-path: /api/proctor

spring:
  application:
    name: proctor
  datasource:
    url: ${PROCTOR_DB_URL:jdbc:postgresql://localhost:5432/proctor}
    username: ${PROCTOR_DB_USER:proctor_svc}
    password: ${PROCTOR_DB_PASSWORD:proctor_dev_pw}
    hikari:
      maximum-pool-size: ${PROCTOR_DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pte}
    password: ${RABBITMQ_PASSWORD:pte}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IAM_JWKS_URI:http://localhost:8081/api/iam/auth/jwks}

scheduling:
  base-url: ${SCHEDULING_URL:http://localhost:8084/api/scheduling}

# Origins allowed to open the /ws STOMP endpoint (comma-separated). JWT auth on
# CONNECT is the primary defense; this is cheap defense-in-depth, not "*".
proctor:
  ws:
    allowed-origin-patterns: ${PROCTOR_WS_ALLOWED_ORIGINS:http://localhost:*}

# Shared secret for calling scheduling's /internal/** surface (ADR-003 mTLS placeholder).
internal:
  service-key: ${INTERNAL_SERVICE_KEY:dev-internal-service-key-change-me}

# The ONE guarded call, made once per ProctorSession-open (phase-10).
resilience4j:
  circuitbreaker:
    instances:
      scheduling:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.pte.proctor.domain.exception.NotAssignedToSessionException

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Outbox polling relay (rabbitmq-outbox-migration Phase 2) — defaults live in
# AbstractOutboxRelay/AbstractOutboxCleanupJob; override here only if tuning is needed.
pte:
  outbox:
    poll-interval-ms: 2000
    batch-size: 100
    max-publish-attempts: 10
    cleanup-retention-days: 7
