server:
  port: ${SCORING_PORT:8087}
  servlet:
    context-path: /api/scoring

spring:
  application:
    name: scoring
  datasource:
    url: ${SCORING_DB_URL:jdbc:postgresql://localhost:5432/scoring}
    username: ${SCORING_DB_USER:scoring_svc}
    password: ${SCORING_DB_PASSWORD:scoring_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pte}
    password: ${RABBITMQ_PASSWORD:pte}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IAM_JWKS_URI:http://localhost:8081/api/iam/auth/jwks}

# Shared secret validating incoming calls to scoring's own /internal/** endpoints
# (rabbitmq-outbox-migration Phase 9's answer-scored export) — ADR-003 mTLS
# placeholder. Must match the value configured on every service in the mesh.
internal:
  service-key: ${INTERNAL_SERVICE_KEY:dev-internal-service-key-change-me}
  # Second credential (Phase 9): required, IN ADDITION TO service-key, to reach
  # the all-tenant bootstrap export mode. Never used for normal per-tenant calls.
  # MORE sensitive than service-key above (unlocks cross-tenant export) — the
  # dev-default fallback here must NEVER be left unset in any real deployment
  # (code-review finding: a forgotten env var here silently exposes cross-tenant
  # data, not just internal-service access). Pre-production checklist item.
  bootstrap-key: ${INTERNAL_BOOTSTRAP_KEY:dev-internal-bootstrap-key-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Outbox polling relay (rabbitmq-outbox-migration Phase 6) — defaults live in
# AbstractOutboxRelay/AbstractOutboxCleanupJob; override here only if tuning is needed.
pte:
  outbox:
    poll-interval-ms: 2000
    batch-size: 100
    max-publish-attempts: 10
    cleanup-retention-days: 7
