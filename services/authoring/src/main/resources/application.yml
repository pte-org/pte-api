server:
  port: ${AUTHORING_PORT:8083}
  servlet:
    context-path: /api/authoring

spring:
  application:
    name: authoring
  datasource:
    url: ${AUTHORING_DB_URL:jdbc:postgresql://localhost:5432/authoring}
    username: ${AUTHORING_DB_USER}
    password: ${AUTHORING_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${AUTHORING_DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IAM_JWKS_URI:http://localhost:8081/api/iam/auth/jwks}

# Shared secret for the /internal/** service-to-service surface (ADR-003 mTLS
# placeholder). MUST match the same env var on every service that calls or
# exposes /internal/**. Supply it through the environment or a secret manager.
internal:
  service-key: ${INTERNAL_SERVICE_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Outbox polling relay (rabbitmq-outbox-migration Phase 2) — defaults live in
# AbstractOutboxRelay/AbstractOutboxCleanupJob; override here only if tuning is needed.
pte:
  outbox:
    poll-interval-ms: 2000
    batch-size: 100
    max-publish-attempts: 10
    cleanup-retention-days: 7

