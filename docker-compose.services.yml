# Local compose: gateway + the app monolith, built from source via the shared
# root Dockerfile. Always run alongside the infra-only docker-compose.yml
# (which owns the pte-network definition + pg-monolith + redis/rabbitmq/minio/
# mailpit/jaeger):
#
#   docker compose --env-file .env \
#     -f docker-compose.yml -f docker-compose.services.yml up --build
#
# plans/modular-monolith Phase 11 cutover: the 9 microservices + media that
# used to live in this file (iam, admin, authoring, scheduling, exam-delivery,
# proctor, scoring, reporting, notification, media) are gone — `app` now
# serves every one of their public API paths, fronted by `gateway`'s
# StripPrefix=2 routes (see gateway/src/main/resources/application.yml). Only
# `gateway` maps a host port; `app` is reached through it.
#
# Rollback: `git revert` the cutover commit restores this file, the gateway
# routes, and services/* (never deleted before this phase) to their
# pre-cutover state — rehearsed via `git stash`/`git stash pop` before this
# commit, see plan.md's Rollback section and the Phase 11 smoke-test report.

x-build-defaults: &build-defaults
  context: .
  dockerfile: Dockerfile

# Every app container shares the same shape: curl its own actuator health
# endpoint. Only `test` (the URL/context-path) differs per service — merge
# this in and override just that key, so tuning start_period/retries fleet-wide
# is a one-line change instead of hand-edits drifting out of sync.
x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 40s

services:
  gateway:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      REDIS_HOST: redis
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # plans/modular-monolith Phase 11 cutover — every route now points at the
      # single app monolith container; see gateway/src/main/resources/application.yml.
      IAM_JWKS_URI: http://app:8091/auth/jwks
      APP_URI: http://app:8091
      # More specific proctor-ws route must keep the ws:// scheme.
      APP_WS_URI: ws://app:8091
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
    networks: [pte-network]

  # MONOLITH — plans/modular-monolith. Since Phase 11 cutover this is the only
  # backend container gateway routes to. Port 8091 (unchanged from Phase 01).
  # No IAM_JWKS_URI: this app validates its own tokens against its own keys
  # (plan.md Phase 02).
  app:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: app
    environment:
      APP_PORT: 8091
      APP_DB_URL: jdbc:postgresql://pg-monolith:5432/pte
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in the env file}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in the env file}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in the env file}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in the env file}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # com.pte.media (Phase 04/A) — server-to-server endpoint is the docker-network
      # hostname; MINIO_PUBLIC_ENDPOINT is what a presigned URL is SIGNED with and
      # must be reachable from the caller (browser, seed script, pte-app on the
      # host) — the host port mapping, not the docker-internal hostname. A deploy
      # overlay points this at the public origin instead.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the env file}
      # com.pte.notification (Phase 09) — Mailpit's SMTP port on the docker network.
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # com.pte.proctoring (Phase 09) — STOMP console origin(s); override per environment.
      PROCTOR_WS_ALLOWED_ORIGINS: ${PROCTOR_WS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # com.pte.attempt (Phase 07) — STRICT answerIntegrityLevel encryption keypair;
      # required outside dev/local profiles (EncryptionKeyProvider fails fast otherwise).
      ATTEMPT_ENCRYPTION_PRIVATE_KEY_PEM: ${ATTEMPT_ENCRYPTION_PRIVATE_KEY_PEM:?set ATTEMPT_ENCRYPTION_PRIVATE_KEY_PEM in the env file}
      ATTEMPT_ENCRYPTION_PUBLIC_KEY_PEM: ${ATTEMPT_ENCRYPTION_PUBLIC_KEY_PEM:?set ATTEMPT_ENCRYPTION_PUBLIC_KEY_PEM in the env file}
      # com.pte.identity (Phase 02) — JWT signing key; empty falls back to an
      # ephemeral key with a startup warning, set explicitly so tokens survive a restart.
      IDENTITY_RSA_PRIVATE_KEY_PEM: ${IDENTITY_RSA_PRIVATE_KEY_PEM:?set IDENTITY_RSA_PRIVATE_KEY_PEM in the env file}
    depends_on:
      pg-monolith:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8091/actuator/health"]
    networks: [pte-network]
