# Local compose: app, built from source via the shared root Dockerfile.
# Always run alongside the infra-only docker-compose.yml (which owns the
# pte-network definition + postgres/redis/rabbitmq/mailpit/jaeger):
#
#   docker compose --env-file .env \
#     -f docker-compose.yml -f docker-compose.services.yml up --build
#
# gateway-removal (follow-up to plans/modular-monolith Phase 11 cutover):
# `gateway` is gone — its JWT validation was always redundant with this app's
# own oauth2ResourceServer (com.pte.identity.internal.config.SecurityConfig),
# and CORS + per-tenant rate limiting were ported into that same class (see
# com.pte.shared.web.RateLimitFilter). Nginx below is only a local edge for
# the same-origin API default; it forwards the versioned REST path unchanged.

x-build-defaults: &build-defaults
  context: .
  dockerfile: Dockerfile

services:
  app:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: app
    ports:
      - "${APP_PORT:-8091}:8091"
    environment:
      APP_PORT: 8091
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-604800}
      SPRING_PROFILES_ACTIVE: ${APP_SPRING_PROFILES:-}
      APP_DB_URL: jdbc:postgresql://postgres:5432/pte
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in the env file}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in the env file}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in the env file}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in the env file}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # com.pte.identity.internal.config.SecurityConfig (gateway-removal) —
      # browser FE origins allowed to call this app directly.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # com.pte.practice (student practice web) — default-off rollout controls.
      PRACTICE_WEB_ENABLED: ${PRACTICE_WEB_ENABLED:-false}
      # Practice answers are scored by the exam scorers (Azure/Gemini keys below); these only tune the practice queue.
      PRACTICE_SCORING_RATE_LIMIT_PER_MINUTE: ${PRACTICE_SCORING_RATE_LIMIT_PER_MINUTE:-10}
      PRACTICE_SCORING_MAX_RETRIES: ${PRACTICE_SCORING_MAX_RETRIES:-2}
      PRACTICE_SCORING_REDISPATCH_AFTER_SECONDS: ${PRACTICE_SCORING_REDISPATCH_AFTER_SECONDS:-100}
      PRACTICE_SCORING_MAX_AGE_SECONDS: ${PRACTICE_SCORING_MAX_AGE_SECONDS:-180}
      PRACTICE_STRICT_ENTITLEMENT_ENABLED: ${PRACTICE_STRICT_ENTITLEMENT_ENABLED:-false}
      # com.pte.chat (student AI chat) — default off. Turning it on also needs
      # PRACTICE_STRICT_ENTITLEMENT_ENABLED=true (else every student gets 403).
      # URL, API key, model and token cap come from QUESTION_GEN_* below.
      CHAT_AI_ENABLED: ${CHAT_AI_ENABLED:-false}
      CHAT_AI_DAILY_LIMIT: ${CHAT_AI_DAILY_LIMIT:-20}
      CHAT_AI_MAX_INPUT_CHARS: ${CHAT_AI_MAX_INPUT_CHARS:-1000}
      CHAT_AI_TEMPERATURE: ${CHAT_AI_TEMPERATURE:-0.2}
      CHAT_AI_HISTORY_SIZE: ${CHAT_AI_HISTORY_SIZE:-6}
      CHAT_AI_MAX_CONCURRENT: ${CHAT_AI_MAX_CONCURRENT:-20}
      CHAT_AI_PRICE_INPUT_PER_MILLION_USD: ${CHAT_AI_PRICE_INPUT_PER_MILLION_USD:-0.10}
      CHAT_AI_PRICE_OUTPUT_PER_MILLION_USD: ${CHAT_AI_PRICE_OUTPUT_PER_MILLION_USD:-0.40}
      CHAT_AI_CONNECT_TIMEOUT_MS: ${CHAT_AI_CONNECT_TIMEOUT_MS:-2000}
      CHAT_AI_READ_TIMEOUT_MS: ${CHAT_AI_READ_TIMEOUT_MS:-90000}
      # com.pte.shared.web.RateLimitFilter (gateway-removal) — per-tenant
      # request ceiling, ported from gateway's Redis token-bucket as a
      # simpler fixed-window counter.
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-40}
      # com.pte.itembank.internal.generation (AI question generation for platform admins) — default off.
      # ':-' also covers a variable left empty in the env file, which Spring would otherwise read as ''.
      QUESTION_GEN_ENABLED: ${QUESTION_GEN_ENABLED:-false}
      QUESTION_GEN_STUB: ${QUESTION_GEN_STUB:-false}
      # Shared AI gateway (Capstone); the old QUESTION_GEN_* names still work as a fallback.
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-${QUESTION_GEN_BASE_URL:-}}
      AI_GATEWAY_WEB_URL: ${AI_GATEWAY_WEB_URL:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-${QUESTION_GEN_API_KEY:-}}
      AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-${QUESTION_GEN_GENERATOR_MODEL:-Capstone}}
      QUESTION_GEN_PRICE_INPUT_PER_MILLION_USD: "${QUESTION_GEN_PRICE_INPUT_PER_MILLION_USD:-0.10}"
      QUESTION_GEN_PRICE_OUTPUT_PER_MILLION_USD: "${QUESTION_GEN_PRICE_OUTPUT_PER_MILLION_USD:-0.40}"
      QUESTION_GEN_REVIEWER_MODEL: ${QUESTION_GEN_REVIEWER_MODEL:-Capstone}
      QUESTION_GEN_IMAGE_MODEL: ${QUESTION_GEN_IMAGE_MODEL:-ag/gemini-3.1-flash-image}
      QUESTION_GEN_IMAGE_MAX_ATTEMPTS: ${QUESTION_GEN_IMAGE_MAX_ATTEMPTS:-2}
      QUESTION_GEN_GENERATOR_TEMPERATURE: ${QUESTION_GEN_GENERATOR_TEMPERATURE:-0.8}
      QUESTION_GEN_REVIEWER_TEMPERATURE: ${QUESTION_GEN_REVIEWER_TEMPERATURE:-0.0}
      QUESTION_GEN_MAX_TOKENS: ${QUESTION_GEN_MAX_TOKENS:-0}
      QUESTION_GEN_CONNECT_TIMEOUT: ${QUESTION_GEN_CONNECT_TIMEOUT:-5s}
      QUESTION_GEN_READ_TIMEOUT: ${QUESTION_GEN_READ_TIMEOUT:-90s}
      QUESTION_GEN_RETRY_DELAY: ${QUESTION_GEN_RETRY_DELAY:-2s}
      QUESTION_GEN_MAX_ITEMS_PER_JOB: ${QUESTION_GEN_MAX_ITEMS_PER_JOB:-10}
      QUESTION_GEN_MAX_ITEMS_PER_USER_PER_DAY: ${QUESTION_GEN_MAX_ITEMS_PER_USER_PER_DAY:-100}
      QUESTION_GEN_MAX_ITEMS_PER_DAY_GLOBAL: ${QUESTION_GEN_MAX_ITEMS_PER_DAY_GLOBAL:-300}
      QUESTION_GEN_MAX_CONCURRENT_JOBS: ${QUESTION_GEN_MAX_CONCURRENT_JOBS:-3}
      QUESTION_GEN_MAX_CALLS_PER_ITEM: ${QUESTION_GEN_MAX_CALLS_PER_ITEM:-40}
      QUESTION_GEN_MAX_CALLS_PER_ROUND: ${QUESTION_GEN_MAX_CALLS_PER_ROUND:-5}
      QUESTION_GEN_CONSECUTIVE_FAILURES_TO_STOP: ${QUESTION_GEN_CONSECUTIVE_FAILURES_TO_STOP:-3}
      QUESTION_GEN_POLL_DELAY_MS: ${QUESTION_GEN_POLL_DELAY_MS:-3000}
      QUESTION_GEN_LEASE_DURATION: ${QUESTION_GEN_LEASE_DURATION:-10m}
      KOKORO_BASE_URL: ${KOKORO_BASE_URL:-}
      KOKORO_WEB_URL: ${KOKORO_WEB_URL:-}
      KOKORO_API_KEY: ${KOKORO_API_KEY:-}
      KOKORO_TIMEOUT: ${KOKORO_TIMEOUT:-300s}
      QUESTION_GEN_VOICES_US: ${QUESTION_GEN_VOICES_US:-af_heart,af_bella,am_michael}
      QUESTION_GEN_VOICES_UK: ${QUESTION_GEN_VOICES_UK:-bf_emma,bm_george}
      # com.pte.media (Cloudinary authoring uploads) — these are deliberately
      # required here so a deployment cannot start with a broken media signer.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?set CLOUDINARY_CLOUD_NAME in the env file}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?set CLOUDINARY_API_KEY in the env file}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?set CLOUDINARY_API_SECRET in the env file}
      CLOUDINARY_AUTHORING_FOLDER: ${CLOUDINARY_AUTHORING_FOLDER:-pte/authoring}
      CLOUDINARY_SUBMISSION_FOLDER: ${CLOUDINARY_SUBMISSION_FOLDER:-pte/submissions}
      # com.pte.notification (Phase 09) — Mailpit's SMTP port on the docker network.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@pteprep.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_SMTP_STARTTLS_REQUIRED:-false}
      # Spring Boot's MailHealthIndicator calls Transport.connect() with a
      # non-null (empty-string) username, which JavaMail treats as an AUTH
      # attempt regardless of mail.smtp.auth=false — always fails against
      # Mailpit (no auth), permanently tanking the app's aggregate
      # /actuator/health and this container's healthcheck. Disabled here
      # since local dev has no real mail credentials to satisfy it anyway.
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      TENANT_APPLICATION_RESPONSE_SLA_HOURS: ${TENANT_APPLICATION_RESPONSE_SLA_HOURS:-72}
      # com.pte.attempt (Phase 07) — STRICT answerIntegrityLevel encryption keypair;
      # required outside dev/local profiles (EncryptionKeyProvider fails fast otherwise).
      ATTEMPT_ENCRYPTION_PRIVATE_KEY_PEM: ${ATTEMPT_ENCRYPTION_PRIVATE_KEY_PEM:?set ATTEMPT_ENCRYPTION_PRIVATE_KEY_PEM in the env file}
      ATTEMPT_ENCRYPTION_PUBLIC_KEY_PEM: ${ATTEMPT_ENCRYPTION_PUBLIC_KEY_PEM:?set ATTEMPT_ENCRYPTION_PUBLIC_KEY_PEM in the env file}
      # com.pte.identity (Phase 02) — JWT signing key; empty falls back to an
      # ephemeral key with a startup warning, set explicitly so tokens survive a restart.
      IDENTITY_RSA_PRIVATE_KEY_PEM: ${IDENTITY_RSA_PRIVATE_KEY_PEM:?set IDENTITY_RSA_PRIVATE_KEY_PEM in the env file}
      # com.pte.billing (PayOS payment-link integration) — required by
      # application.yml's billing.payos.* block (no defaults there except
      # base-url/timeouts). Previously missing from this file entirely, which
      # made `app` fail placeholder resolution at startup even with a
      # perfectly filled-in env file.
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:?set PAYOS_CLIENT_ID in the env file}
      PAYOS_API_KEY: ${PAYOS_API_KEY:?set PAYOS_API_KEY in the env file}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:?set PAYOS_CHECKSUM_KEY in the env file}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:?set PAYOS_RETURN_URL in the env file}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:?set PAYOS_CANCEL_URL in the env file}
      # Task-type contract rollout switch. Keep the safe default for local
      # and hosted environments; enable explicitly through the env file when
      # the authenticated walkthrough is approved.
      TASK_TYPES_CUSTOM_CREATION_ENABLED: ${TASK_TYPES_CUSTOM_CREATION_ENABLED:-false}
      # com.pte.scoring AI provider. stub (default) needs nothing; azure-gemini
      # refuses to start unless AZURE_SPEECH_KEY and AZURE_SPEECH_REGION
      # are set (plus SCORING_AI_GEMINI_API_KEY for the gemini text vendor). SCORING_AI_TEXT_VENDOR=gateway
      # replaces Gemini with the AI_GATEWAY_* gateway (Capstone); Azure stays.
      SCORING_AI_PROVIDER: ${SCORING_AI_PROVIDER:-stub}
      SCORING_AI_AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      SCORING_AI_AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      SCORING_AI_TEXT_VENDOR: ${SCORING_AI_TEXT_VENDOR:-gemini}
      # Tuning read by application.yml; each default below equals the built-in one, so an unset variable
      # changes nothing. (SCORING_AI_GATEWAY_* are left out on purpose: an empty value here would hide the
      # QUESTION_GEN_* fallback. Add them only with a real value.)
      APP_DB_POOL_SIZE: "${APP_DB_POOL_SIZE:-10}"
      ATTEMPT_ALLOW_LEGACY_MISSING_MANIFEST: "${ATTEMPT_ALLOW_LEGACY_MISSING_MANIFEST:-true}"
      ATTEMPT_SECURITY_AUDIT_RETENTION_CRON: "${ATTEMPT_SECURITY_AUDIT_RETENTION_CRON:-0 0 2 * * *}"
      ATTEMPT_SECURITY_AUDIT_RETENTION_DAYS: "${ATTEMPT_SECURITY_AUDIT_RETENTION_DAYS:-180}"
      ATTEMPT_STRICT_PRE_FLIGHT_ENABLED: "${ATTEMPT_STRICT_PRE_FLIGHT_ENABLED:-false}"
      BILLING_LICENSE_CODE_EXPIRATION_CRON: "${BILLING_LICENSE_CODE_EXPIRATION_CRON:-0 15 * * * *}"
      BILLING_ORDER_EXPIRATION_CRON: "${BILLING_ORDER_EXPIRATION_CRON:-0 0 * * * *}"
      BILLING_ORDER_PENDING_TTL_HOURS: "${BILLING_ORDER_PENDING_TTL_HOURS:-24}"
      MAIL_SMTP_CONNECTION_TIMEOUT_MS: "${MAIL_SMTP_CONNECTION_TIMEOUT_MS:-5000}"
      MAIL_SMTP_TIMEOUT_MS: "${MAIL_SMTP_TIMEOUT_MS:-10000}"
      MAIL_SMTP_WRITE_TIMEOUT_MS: "${MAIL_SMTP_WRITE_TIMEOUT_MS:-10000}"
      NOTIFICATION_INBOX_BATCH_SIZE: "${NOTIFICATION_INBOX_BATCH_SIZE:-50}"
      NOTIFICATION_INBOX_ENABLED: "${NOTIFICATION_INBOX_ENABLED:-false}"
      NOTIFICATION_INBOX_INITIAL_RETRY_SECONDS: "${NOTIFICATION_INBOX_INITIAL_RETRY_SECONDS:-5}"
      NOTIFICATION_INBOX_LEASE_SECONDS: "${NOTIFICATION_INBOX_LEASE_SECONDS:-30}"
      NOTIFICATION_INBOX_MAX_ATTEMPTS: "${NOTIFICATION_INBOX_MAX_ATTEMPTS:-5}"
      NOTIFICATION_INBOX_MAX_RETRY_SECONDS: "${NOTIFICATION_INBOX_MAX_RETRY_SECONDS:-300}"
      NOTIFICATION_INBOX_POLL_DELAY_MS: "${NOTIFICATION_INBOX_POLL_DELAY_MS:-1000}"
      NOTIFICATION_INBOX_RETRY_JITTER_SECONDS: "${NOTIFICATION_INBOX_RETRY_JITTER_SECONDS:-3}"
      NOTIFICATION_SESSION_REMINDER_POLL_DELAY_MS: "${NOTIFICATION_SESSION_REMINDER_POLL_DELAY_MS:-60000}"
      NOTIFICATION_SESSION_REMINDER_THRESHOLD_SECONDS: "${NOTIFICATION_SESSION_REMINDER_THRESHOLD_SECONDS:-900}"
      PASSWORD_RESET_RETENTION_DAYS: "${PASSWORD_RESET_RETENTION_DAYS:-7}"
      PASSWORD_RESET_TOKEN_TTL_MINUTES: "${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}"
      PAYOS_BASE_URL: "${PAYOS_BASE_URL:-https://api-merchant.payos.vn}"
      PAYOS_CONNECT_TIMEOUT_MS: "${PAYOS_CONNECT_TIMEOUT_MS:-2000}"
      PAYOS_PAYMENT_LINK_TTL_HOURS: "${PAYOS_PAYMENT_LINK_TTL_HOURS:-24}"
      PAYOS_READ_TIMEOUT_MS: "${PAYOS_READ_TIMEOUT_MS:-10000}"
      QUESTION_GEN_VISION_CHECK: "${QUESTION_GEN_VISION_CHECK:-false}"
      REDEEM_RATE_LIMIT_PER_SECOND: "${REDEEM_RATE_LIMIT_PER_SECOND:-5}"
      SCORING_AI_API_KEY: "${SCORING_AI_API_KEY:-}"
      SCORING_AI_AUDIO_FORMAT: "${SCORING_AI_AUDIO_FORMAT:-wav}"
      SCORING_AI_AZURE_TIMEOUT_MS: "${SCORING_AI_AZURE_TIMEOUT_MS:-60000}"
      SCORING_AI_BASE_URL: "${SCORING_AI_BASE_URL:-https://api.openai.com/v1}"
      SCORING_AI_CONNECT_TIMEOUT_MS: "${SCORING_AI_CONNECT_TIMEOUT_MS:-2000}"
      SCORING_AI_ESSAY_MODEL: "${SCORING_AI_ESSAY_MODEL:-}"
      SCORING_AI_GATEWAY_TIMEOUT_MS: "${SCORING_AI_GATEWAY_TIMEOUT_MS:-60000}"
      SCORING_AI_PRACTICE_SPEECH_VENDOR: ${SCORING_AI_PRACTICE_SPEECH_VENDOR:-gateway}
      SCORING_AI_JOB_BUDGET_MS: "${SCORING_AI_JOB_BUDGET_MS:-90000}"
      SCORING_AI_MAX_TOKENS: "${SCORING_AI_MAX_TOKENS:-800}"
      SCORING_AI_MEDIA_URL_TTL_SECONDS: "${SCORING_AI_MEDIA_URL_TTL_SECONDS:-120}"
      SCORING_AI_READ_TIMEOUT_MS: "${SCORING_AI_READ_TIMEOUT_MS:-30000}"
      SCORING_AI_SPEECH_MODEL: "${SCORING_AI_SPEECH_MODEL:-}"
      SCORING_AI_STALE_DISPATCH_MINUTES: "${SCORING_AI_STALE_DISPATCH_MINUTES:-10}"
      SCORING_GRADING_RECONCILIATION_POLL_DELAY_MS: "${SCORING_GRADING_RECONCILIATION_POLL_DELAY_MS:-60000}"
      VIETNAM_LOCATION_BASE_URL: "${VIETNAM_LOCATION_BASE_URL:-https://provinces.open-api.vn/api/v2}"
      VIETNAM_LOCATION_CACHE_TTL_MS: "${VIETNAM_LOCATION_CACHE_TTL_MS:-86400000}"
      VIETNAM_LOCATION_CONNECT_TIMEOUT_MS: "${VIETNAM_LOCATION_CONNECT_TIMEOUT_MS:-2000}"
      VIETNAM_LOCATION_READ_TIMEOUT_MS: "${VIETNAM_LOCATION_READ_TIMEOUT_MS:-10000}"
      ATTEMPT_CONTENT_CACHE_LOCK_TTL: "${ATTEMPT_CONTENT_CACHE_LOCK_TTL:-10s}"
      ATTEMPT_CONTENT_CACHE_TTL: "${ATTEMPT_CONTENT_CACHE_TTL:-24h}"
      ATTEMPT_MEDIA_URL_GRACE_SECONDS: "${ATTEMPT_MEDIA_URL_GRACE_SECONDS:-60}"
      ATTEMPT_MEDIA_URL_RELOAD_MARGIN_SECONDS: "${ATTEMPT_MEDIA_URL_RELOAD_MARGIN_SECONDS:-600}"
      BILLING_LICENSE_REVOKE_PREVIEW_TTL: "${BILLING_LICENSE_REVOKE_PREVIEW_TTL:-5m}"
      CLOUDINARY_SIGNATURE_TTL_SECONDS: "${CLOUDINARY_SIGNATURE_TTL_SECONDS:-900}"
      IDEMPOTENCY_PURGE_CRON: "${IDEMPOTENCY_PURGE_CRON:-0 15 3 * * *}"
      LOGIN_FAILURE_LIMIT: "${LOGIN_FAILURE_LIMIT:-5}"
      LOGIN_LOCK_WINDOW: "${LOGIN_LOCK_WINDOW:-15m}"
      NOTIFICATION_EMAIL_RETRY_INITIAL_INTERVAL_MS: "${NOTIFICATION_EMAIL_RETRY_INITIAL_INTERVAL_MS:-2000}"
      NOTIFICATION_EMAIL_RETRY_MAX_ATTEMPTS: "${NOTIFICATION_EMAIL_RETRY_MAX_ATTEMPTS:-3}"
      NOTIFICATION_EMAIL_RETRY_MAX_INTERVAL_MS: "${NOTIFICATION_EMAIL_RETRY_MAX_INTERVAL_MS:-10000}"
      PASSWORD_RESET_EMAIL_LIMIT: "${PASSWORD_RESET_EMAIL_LIMIT:-3}"
      PASSWORD_RESET_IP_LIMIT: "${PASSWORD_RESET_IP_LIMIT:-10}"
      PASSWORD_RESET_MAIL_MAX_THREADS: "${PASSWORD_RESET_MAIL_MAX_THREADS:-4}"
      PASSWORD_RESET_MAIL_QUEUE_CAPACITY: "${PASSWORD_RESET_MAIL_QUEUE_CAPACITY:-200}"
      PASSWORD_RESET_THROTTLE_WINDOW: "${PASSWORD_RESET_THROTTLE_WINDOW:-15m}"
      PRACTICE_ENTITLEMENT_REFRESH_SECONDS: "${PRACTICE_ENTITLEMENT_REFRESH_SECONDS:-300}"
      QUESTION_GEN_LIVE_FINISHED_RETENTION_MS: "${QUESTION_GEN_LIVE_FINISHED_RETENTION_MS:-600000}"
      QUESTION_GEN_LIVE_HEARTBEAT_MS: "${QUESTION_GEN_LIVE_HEARTBEAT_MS:-15000}"
      QUESTION_GEN_LIVE_IDLE_RETENTION_MS: "${QUESTION_GEN_LIVE_IDLE_RETENTION_MS:-1800000}"
      QUESTION_GEN_LIVE_STREAM_TIMEOUT_MS: "${QUESTION_GEN_LIVE_STREAM_TIMEOUT_MS:-1800000}"
      SCORING_AI_BREAKER_THRESHOLD: "${SCORING_AI_BREAKER_THRESHOLD:-5}"
      SCORING_AI_RETRY_MAX_ATTEMPTS: "${SCORING_AI_RETRY_MAX_ATTEMPTS:-3}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [pte-network]

  nginx:
    image: nginx:1.27-alpine
    container_name: pte-nginx
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.local.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [pte-network]
