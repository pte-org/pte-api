# Full-stack local compose: gateway + all 10 backend microservices, built from
# source via the shared root Dockerfile. Always run alongside the infra-only
# docker-compose.yml (which owns the pte-network definition + postgres/redis/
# rabbitmq/minio/mailpit/jaeger):
#
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up --build
#
# No service here maps a host port except gateway (see docker-compose.services.yml
# gateway block, added alongside these) — every backend service is reached only
# through the gateway or, for the handful of direct service-to-service calls
# documented below, via the internal pte-network.

x-build-defaults: &build-defaults
  context: .
  dockerfile: Dockerfile

# Every app container shares the same shape: curl its own actuator health
# endpoint. Only `test` (the URL/context-path) differs per service — merge
# this in and override just that key, so tuning start_period/retries fleet-wide
# is a one-line change instead of 11 hand-edits drifting out of sync.
x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 40s

services:
  iam:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: services/iam
    environment:
      IAM_DB_URL: jdbc:postgresql://postgres:5432/iam
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pte}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8081/api/iam/actuator/health"]
    networks: [pte-network]

  admin:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: services/admin
    environment:
      ADMIN_DB_URL: jdbc:postgresql://postgres:5432/admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pte}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      IAM_JWKS_URI: http://iam:8081/api/iam/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8082/api/admin/actuator/health"]
    networks: [pte-network]

  authoring:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: services/authoring
    environment:
      AUTHORING_DB_URL: jdbc:postgresql://postgres:5432/authoring
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pte}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      IAM_JWKS_URI: http://iam:8081/api/iam/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8083/api/authoring/actuator/health"]
    networks: [pte-network]

  scheduling:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: services/scheduling
    environment:
      SCHEDULING_DB_URL: jdbc:postgresql://postgres:5432/scheduling
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pte}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      IAM_JWKS_URI: http://iam:8081/api/iam/auth/jwks
      # Direct inter-service call, bypasses the gateway (see spec Assumptions).
      AUTHORING_URL: http://authoring:8083/api/authoring
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8084/api/scheduling/actuator/health"]
    networks: [pte-network]

  exam-delivery:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: services/exam-delivery
    environment:
      # Note: db name is "exam_delivery" (underscore); module dir is "exam-delivery" (hyphen).
      EXAM_DELIVERY_DB_URL: jdbc:postgresql://postgres:5432/exam_delivery
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pte}
      REDIS_HOST: redis
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      IAM_JWKS_URI: http://iam:8081/api/iam/auth/jwks
      # Direct inter-service calls, bypass the gateway (see spec Assumptions).
      AUTHORING_URL: http://authoring:8083/api/authoring
      SCHEDULING_URL: http://scheduling:8084/api/scheduling
      # Without this, EncryptionKeyProvider's own default (`prod`) refuses to
      # start without a real EXAM_DELIVERY_ENCRYPTION_PRIVATE_KEY_PEM/PUBLIC_KEY_PEM
      # pair configured — fails fast by design rather than silently generating
      # an ephemeral keypair in a real deployment (see EncryptionKeyProvider's
      # own doc comment). `dev`/`local` are the two profiles it allows to
      # fall back to a generated ephemeral keypair instead, which is fine for
      # this local compose stack (found + fixed via plans/phat-speaking-api-e2e-verify).
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8085/api/exam-delivery/actuator/health"]
    networks: [pte-network]

  proctor:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: services/proctor
    environment:
      PROCTOR_DB_URL: jdbc:postgresql://postgres:5432/proctor
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pte}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      IAM_JWKS_URI: http://iam:8081/api/iam/auth/jwks
      # Direct inter-service call, bypasses the gateway (see spec Assumptions).
      SCHEDULING_URL: http://scheduling:8084/api/scheduling
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8086/api/proctor/actuator/health"]
    networks: [pte-network]

  scoring:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: services/scoring
    environment:
      SCORING_DB_URL: jdbc:postgresql://postgres:5432/scoring
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pte}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      IAM_JWKS_URI: http://iam:8081/api/iam/auth/jwks
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8087/api/scoring/actuator/health"]
    networks: [pte-network]

  reporting:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: services/reporting
    environment:
      REPORTING_DB_URL: jdbc:postgresql://postgres:5432/reporting
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pte}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      IAM_JWKS_URI: http://iam:8081/api/iam/auth/jwks
      # Direct inter-service calls, bypass the gateway (see spec Assumptions).
      EXAM_DELIVERY_URL: http://exam-delivery:8085/api/exam-delivery
      SCORING_URL: http://scoring:8087/api/scoring
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8088/api/reporting/actuator/health"]
    networks: [pte-network]

  notification:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: services/notification
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pte}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      IAM_JWKS_URI: http://iam:8081/api/iam/auth/jwks
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8089/api/notification/actuator/health"]
    networks: [pte-network]

  # Sole service exposed to the host — every backend service above is reached
  # only through this gateway (or, for the handful of direct service-to-service
  # calls documented above, via pte-network). No hard depends_on/healthy gate on
  # the 10 backend services: JWT-consuming routes accept a first-boot retry
  # window rather than blocking gateway startup (spec decision). redis IS
  # hard-gated since the rate limiter needs it synchronously per request.
  gateway:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      REDIS_HOST: redis
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      IAM_JWKS_URI: http://iam:8081/api/iam/auth/jwks
      IAM_URI: http://iam:8081
      ADMIN_URI: http://admin:8082
      AUTHORING_URI: http://authoring:8083
      SCHEDULING_URI: http://scheduling:8084
      EXAM_DELIVERY_URI: http://exam-delivery:8085
      # More specific than PROCTOR_URI — must keep the ws:// scheme.
      PROCTOR_WS_URI: ws://proctor:8086
      PROCTOR_URI: http://proctor:8086
      SCORING_URI: http://scoring:8087
      REPORTING_URI: http://reporting:8088
      NOTIFICATION_URI: http://notification:8089
      MEDIA_URI: http://media:8090
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
    networks: [pte-network]

  # media has no RabbitMQ configuration at all (verified against its application.yml) —
  # deliberately excluded from RABBITMQ_HOST / the rabbitmq depends_on gate.
  media:
    build:
      <<: *build-defaults
      args:
        SERVICE_MODULE: services/media
    environment:
      MEDIA_DB_URL: jdbc:postgresql://postgres:5432/media
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      IAM_JWKS_URI: http://iam:8081/api/iam/auth/jwks
      MINIO_ENDPOINT: http://minio:9000
      # Presigned URLs are handed to an external caller (a student's pte-app
      # instance on the host machine, not another container) — `minio` only
      # resolves inside this compose network. `localhost:9000` is what the
      # host machine actually reaches, since minio's docker-compose.yml maps
      # container port 9000 to the same host port (found + fixed via
      # plans/phat-speaking-api-e2e-verify Phase 3).
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pte-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pte-minio-dev-pw}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-sf", "http://localhost:8090/api/media/actuator/health"]
    networks: [pte-network]
