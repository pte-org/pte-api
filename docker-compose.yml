name: pte-platform

# Local infrastructure for the PTE microservice platform (Phase 0).
# Service apps are added as they are implemented; this file is the shared
# backbone: one Postgres instance (database-per-service), Kafka + Schema
# Registry + Debezium (event backbone, ADR-002), Redis (cache/rate-limit/
# single-flight, ADR-003), RabbitMQ (work queue, ADR-002).

services:
  postgres:
    image: postgres:17
    container_name: pte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pte_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # wal_level=logical is required for Debezium CDC (outbox relay).
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  redis:
    image: redis:7-alpine
    container_name: pte-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [pte-network]

  minio:
    image: minio/minio:latest
    container_name: pte-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pte-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pte-minio-dev-pw}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - pte_minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  mailpit:
    image: axllent/mailpit:latest
    container_name: pte-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pte-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pte}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pte-network]

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: pte-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      # Single-node KRaft (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: pte-kafka-cluster-0001
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [pte-network]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: pte-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8091}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks: [pte-network]

  debezium-connect:
    image: debezium/connect:2.7.3.Final
    container_name: pte-debezium
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${DEBEZIUM_PORT:-8092}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: pte-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [pte-network]

  # One-shot: registers every docker/debezium/connectors/*.json outbox
  # connector against debezium-connect once it's healthy (Phase 6). Idempotent
  # (PUT .../config), safe to re-run via `docker compose up debezium-connectors-setup`.
  debezium-connectors-setup:
    image: alpine:3.20
    container_name: pte-debezium-connectors-setup
    depends_on:
      debezium-connect:
        condition: service_healthy
    volumes:
      - ./docker/debezium:/debezium:ro
    entrypoint: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /debezium/register-connectors.sh"]
    environment:
      DEBEZIUM_CONNECT_URL: http://debezium-connect:8083
    networks: [pte-network]
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: pte-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [pte-network]

volumes:
  pte_postgres_data:
    name: pte_postgres_data
  pte_minio_data:
    name: pte_minio_data

networks:
  pte-network:
    driver: bridge
