name: pte-platform

# Local infrastructure for the PTE platform: Postgres, RabbitMQ (event
# backbone, ADR-002 superseded by rabbitmq-outbox-migration — Kafka/Schema
# Registry/Debezium retired Phase 10), Redis (cache/rate-limit/single-flight,
# ADR-003).
#
# See docker-compose.services.yml for how `app` connects to this infra.

services:
  # Single database `pte` for the `app` module. POSTGRES_DB/USER/PASSWORD
  # point straight at APP_DB_*.
  postgres:
    image: postgres:17
    container_name: pte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pte
      POSTGRES_USER: ${APP_DB_USER:?set APP_DB_USER in the env file}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in the env file}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pte_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:?set APP_DB_USER in the env file}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  redis:
    image: redis:7-alpine
    container_name: pte-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [pte-network]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: pte-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the env file}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - pte_minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  mailpit:
    image: axllent/mailpit:v1.28.4
    container_name: pte-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pte-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in the env file}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in the env file}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pte-network]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: pte-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [pte-network]

volumes:
  pte_postgres_data:
    name: pte_postgres_data
  pte_minio_data:
    name: pte_minio_data

networks:
  pte-network:
    driver: bridge
