name: pte-platform

# Local infrastructure for the PTE microservice platform (Phase 0).
# Service apps are added as they are implemented; this file is the shared
# backbone: one Postgres instance (database-per-service), RabbitMQ (event
# backbone + work queue, ADR-002 superseded by rabbitmq-outbox-migration —
# Kafka/Schema Registry/Debezium retired Phase 10), Redis (cache/rate-limit/
# single-flight, ADR-003).

services:
  postgres:
    image: postgres:17
    container_name: pte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # postgres-utc-timestamptz-migration Phase 1: explicit, not relying on the base
      # image's implicit default — survives an image change that might alter it.
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pte_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # wal_level=logical was required for Debezium CDC, now removed
    # (rabbitmq-outbox-migration Phase 10). Left set deliberately — low-cost
    # no-op, no relay in this migration depends on it, and reverting is a
    # Postgres restart either way; not worth the risk of removing on a guess.
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  redis:
    image: redis:7-alpine
    container_name: pte-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [pte-network]

  minio:
    image: minio/minio:latest
    container_name: pte-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pte-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pte-minio-dev-pw}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - pte_minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  mailpit:
    image: axllent/mailpit:latest
    container_name: pte-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pte-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pte}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pte-network]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: pte-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [pte-network]

volumes:
  pte_postgres_data:
    name: pte_postgres_data
  pte_minio_data:
    name: pte_minio_data

networks:
  pte-network:
    driver: bridge
