name: pte-platform

# Local infrastructure for the PTE microservice platform.
# Backbone: FOUR Postgres instances (one per cell), RabbitMQ (event backbone +
# work queue, ADR-002 superseded by rabbitmq-outbox-migration — Kafka/Schema
# Registry/Debezium retired Phase 10), Redis (cache/rate-limit/single-flight,
# ADR-003).
#
# ── Cell-based re-architecture, step 1 of 5 ──────────────────────────────────
# Previously ONE `postgres` container held all 10 databases. Database-per-service
# (ADR-003) was therefore logical only: a restart, a full disk, or a lock on that
# single process took down all 10 services simultaneously — 10 services, but one
# failure domain. The old init script said as much: "splitting to separate
# instances later is a connection-string change, not a code change." This is that
# change; no Java was touched, because ADR-001 already forbade cross-database
# queries so nothing had a join to break.
#
# Cells are cut by RESOURCE-EXHAUSTION PROFILE, not by capability and not by
# actor — two modules that exhaust the same resource gain nothing from being
# split apart:
#
#   pg-exam  :5433  exam-delivery   latency + pool     downtime tolerance: ZERO
#   pg-live  :5434  proctor         WS conns + FDs     degrades gracefully
#   pg-core  :5432  7 services       ~nothing          5-10 min
#   pg-async :5435  scoring         CPU + vendor wait  queue absorbs it
#
# pg-core keeps host port 5432 so the application.yml localhost defaults of its
# seven services stay valid for non-Docker local runs; only the three relocated
# services had their defaults updated.
#
# `wal_level=logical` was required for Debezium CDC, now removed
# (rabbitmq-outbox-migration Phase 10). Left set deliberately — low-cost no-op,
# no relay depends on it, and reverting is a Postgres restart either way.

x-postgres-defaults: &postgres-defaults
  image: postgres:17
  restart: unless-stopped
  environment: &postgres-env
    POSTGRES_DB: postgres
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # postgres-utc-timestamptz-migration Phase 1: explicit, not relying on the base
    # image's implicit default — survives an image change that might alter it.
    TZ: UTC
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 10s
  networks: [pte-network]

services:
  # CELL CORE — iam, admin, authoring, scheduling, reporting, notification, media.
  # 7 services x default Hikari pool (10) = 70; 120 leaves headroom for a manual
  # psql session and for the second CORE instance (admin/host split) added later.
  pg-core:
    <<: *postgres-defaults
    container_name: pte-pg-core
    ports:
      - "${PG_CORE_PORT:-5432}:5432"
    volumes:
      - pte_pg_core_data:/var/lib/postgresql/data
      - ./docker/postgres/init-core:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "max_connections=120", "-c", "wal_level=logical"]

  # CELL EXAM — exam-delivery only. Sized well above its single Hikari pool: this
  # is the one service whose connection starvation is unrecoverable for a user.
  pg-exam:
    <<: *postgres-defaults
    container_name: pte-pg-exam
    ports:
      - "${PG_EXAM_PORT:-5433}:5432"
    volumes:
      - pte_pg_exam_data:/var/lib/postgresql/data
      - ./docker/postgres/init-exam:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "max_connections=100", "-c", "wal_level=logical"]

  # CELL LIVE — proctor only.
  pg-live:
    <<: *postgres-defaults
    container_name: pte-pg-live
    ports:
      - "${PG_LIVE_PORT:-5434}:5432"
    volumes:
      - pte_pg_live_data:/var/lib/postgresql/data
      - ./docker/postgres/init-live:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "max_connections=50", "-c", "wal_level=logical"]

  # CELL ASYNC — scoring only.
  pg-async:
    <<: *postgres-defaults
    container_name: pte-pg-async
    ports:
      - "${PG_ASYNC_PORT:-5435}:5432"
    volumes:
      - pte_pg_async_data:/var/lib/postgresql/data
      - ./docker/postgres/init-async:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "max_connections=50", "-c", "wal_level=logical"]

  redis:
    image: redis:7-alpine
    container_name: pte-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [pte-network]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: pte-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pte-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pte-minio-dev-pw}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - pte_minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  mailpit:
    image: axllent/mailpit:v1.28.4
    container_name: pte-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pte-network]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pte-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pte}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pte}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pte-network]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: pte-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [pte-network]

volumes:
  # One volume per cell — a corrupted/filled volume takes down exactly one cell.
  # The old single `pte_postgres_data` is intentionally NOT reused: mounting it
  # into pg-core would leave the other three cells' databases sitting unused
  # inside it. Existing local data must be re-seeded (dev only).
  pte_pg_core_data:
    name: pte_pg_core_data
  pte_pg_exam_data:
    name: pte_pg_exam_data
  pte_pg_live_data:
    name: pte_pg_live_data
  pte_pg_async_data:
    name: pte_pg_async_data
  pte_minio_data:
    name: pte_minio_data

networks:
  pte-network:
    driver: bridge
