server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          # iam publishes JWKS; the gateway validates every token locally against it.
          jwk-set-uri: ${IAM_JWKS_URI:http://localhost:8081/api/iam/auth/jwks}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@tenantKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_REPLENISH:20}
                redis-rate-limiter.burstCapacity: ${RATE_BURST:40}
          routes:
            - id: iam
              uri: ${IAM_URI:http://localhost:8081}
              predicates:
                - Path=/api/iam/**
            - id: admin
              uri: ${ADMIN_URI:http://localhost:8082}
              predicates:
                - Path=/api/admin/**
            - id: authoring
              uri: ${AUTHORING_URI:http://localhost:8083}
              predicates:
                - Path=/api/authoring/**
            - id: scheduling
              uri: ${SCHEDULING_URI:http://localhost:8084}
              predicates:
                - Path=/api/scheduling/**
            - id: exam-delivery
              uri: ${EXAM_DELIVERY_URI:http://localhost:8085}
              predicates:
                - Path=/api/exam-delivery/**
            # More specific than the general "proctor" route below — must be listed first so the STOMP
            # upgrade path matches before the general HTTP route (phase-10, runtime-verification TODO).
            - id: proctor-ws
              uri: ${PROCTOR_WS_URI:ws://localhost:8086}
              predicates:
                - Path=/api/proctor/ws/**
            - id: proctor
              uri: ${PROCTOR_URI:http://localhost:8086}
              predicates:
                - Path=/api/proctor/**
            - id: scoring
              uri: ${SCORING_URI:http://localhost:8087}
              predicates:
                - Path=/api/scoring/**
            - id: reporting
              uri: ${REPORTING_URI:http://localhost:8088}
              predicates:
                - Path=/api/reporting/**
            - id: notification
              uri: ${NOTIFICATION_URI:http://localhost:8089}
              predicates:
                - Path=/api/notification/**
            - id: media
              uri: ${MEDIA_URI:http://localhost:8090}
              predicates:
                - Path=/api/media/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

