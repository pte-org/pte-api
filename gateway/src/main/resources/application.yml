server:
  port: ${GATEWAY_PORT:8080}

app:
  cors:
    # Browser FE origins allowed to call the gateway directly. Comma-separated,
    # overridable via env for hosted deployments.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          # com.pte.identity (in the app monolith since Phase 02) publishes JWKS
          # at bare "/auth/jwks" (no context-path) — the gateway validates every
          # token locally against it.
          jwk-set-uri: ${IAM_JWKS_URI:http://localhost:8091/auth/jwks}
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@tenantKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_REPLENISH:20}
                redis-rate-limiter.burstCapacity: ${RATE_BURST:40}
          # plans/modular-monolith Phase 11 cutover: every route below points at
          # the SAME `app` monolith now, not 9 separate services — the client-facing
          # path contract (Path predicate) is unchanged, so no FE/mobile client
          # needed a code change. StripPrefix=2 removes the "/api/{service}" the
          # old per-service context-path required; app's own controllers mount at
          # bare root (no context-path), matching what StripPrefix=2 forwards.
          routes:
            - id: iam
              uri: ${APP_URI:http://localhost:8091}
              predicates:
                - Path=/api/iam/**
              filters:
                - StripPrefix=2
            - id: admin
              uri: ${APP_URI:http://localhost:8091}
              predicates:
                - Path=/api/admin/**
              filters:
                - StripPrefix=2
            - id: authoring
              uri: ${APP_URI:http://localhost:8091}
              predicates:
                - Path=/api/authoring/**
              filters:
                - StripPrefix=2
            - id: scheduling
              uri: ${APP_URI:http://localhost:8091}
              predicates:
                - Path=/api/scheduling/**
              filters:
                - StripPrefix=2
            - id: exam-delivery
              uri: ${APP_URI:http://localhost:8091}
              predicates:
                - Path=/api/exam-delivery/**
              filters:
                - StripPrefix=2
            # More specific than the general "proctor" route below — must be listed first so the STOMP
            # upgrade path matches before the general HTTP route.
            - id: proctor-ws
              uri: ${APP_WS_URI:ws://localhost:8091}
              predicates:
                - Path=/api/proctor/ws/**
              filters:
                - StripPrefix=2
            - id: proctor
              uri: ${APP_URI:http://localhost:8091}
              predicates:
                - Path=/api/proctor/**
              filters:
                - StripPrefix=2
            - id: scoring
              uri: ${APP_URI:http://localhost:8091}
              predicates:
                - Path=/api/scoring/**
              filters:
                - StripPrefix=2
            - id: reporting
              uri: ${APP_URI:http://localhost:8091}
              predicates:
                - Path=/api/reporting/**
              filters:
                - StripPrefix=2
            - id: notification
              uri: ${APP_URI:http://localhost:8091}
              predicates:
                - Path=/api/notification/**
              filters:
                - StripPrefix=2
            - id: media
              uri: ${APP_URI:http://localhost:8091}
              predicates:
                - Path=/api/media/**
              filters:
                - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

