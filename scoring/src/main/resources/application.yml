server:
  port: ${SCORING_PORT:8087}
  servlet:
    context-path: /api/scoring

spring:
  application:
    name: scoring
  datasource:
    url: ${SCORING_DB_URL:jdbc:postgresql://localhost:5432/scoring}
    username: ${SCORING_DB_USER:scoring_svc}
    password: ${SCORING_DB_PASSWORD:scoring_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: scoring
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
